# Render Blueprint - deploy toàn bộ hệ thống trong 1 lần "New +" > "Blueprint" trên Render,
# trỏ vào repo GitHub này. Render sẽ tự tạo đủ 6 dịch vụ bên dưới (2 datastore + 4 app).
#
# Sau khi Blueprint chạy xong lần đầu, còn vài biến môi trường KHÔNG đặt được tự động ở đây
# (env: false) vì phụ thuộc thông tin bên ngoài Render (Google Console, Cloudinary, SMTP...) -
# vào từng service > Environment để điền tay, xem chi tiết trong README/hướng dẫn deploy.

databases:
  - name: smartfashion-db
    databaseName: smartfashion
    user: smartfashion
    plan: free

services:
  # ---- Redis (cache + mã OTP tạm thời) ----
  - type: redis
    name: smartfashion-redis
    plan: free
    ipAllowList: []

  # ---- Core Backend (NestJS API) ----
  - type: web
    name: smartfashion-backend
    runtime: docker
    dockerfilePath: ./core-backend/Dockerfile.render
    dockerContext: ./core-backend
    plan: free
    healthCheckPath: /api/v1/settings
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartfashion-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: smartfashion-redis
          property: connectionString
      - key: CORE_BACKEND_PORT
        value: 4000
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      # "fromService ... property: hostport" không phải property thật của Render (chỉ có host/port
      # riêng, không có dạng gộp) nên trước đó luôn báo "used but not defined". Ghi thẳng URL dự
      # đoán được theo đúng quy luật tên miền Render (https://<tên service>.onrender.com) - tên
      # service khớp chính xác với "name" khai báo bên dưới nên không lo bị đoán sai.
      - key: RECOMMENDATION_SERVICE_URL
        value: https://smartfashion-recommendation.onrender.com
      - key: RECOMMENDATION_TIMEOUT_MS
        value: 1500
      - key: STOREFRONT_ORIGIN
        value: https://smartfashion-storefront.onrender.com
      - key: ADMIN_ORIGIN
        value: https://smartfashion-admin.onrender.com
      # Điền tay sau khi deploy (xem README): Google OAuth, Cloudinary, SMTP.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

  # ---- Storefront (Next.js) ----
  - type: web
    name: smartfashion-storefront
    runtime: docker
    dockerfilePath: ./storefront/Dockerfile.render
    dockerContext: ./storefront
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://smartfashion-backend.onrender.com/api/v1
      - key: INTERNAL_API_URL
        value: https://smartfashion-backend.onrender.com/api/v1

  # ---- Admin Dashboard (React + Vite, static site - không cần Docker) ----
  - type: web
    name: smartfashion-admin
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: admin-dashboard
    envVars:
      - key: VITE_API_URL
        value: https://smartfashion-backend.onrender.com/api/v1
      - key: VITE_REC_SERVICE_URL
        value: https://smartfashion-recommendation.onrender.com

  # ---- Recommendation Service (Python/FastAPI) ----
  - type: web
    name: smartfashion-recommendation
    runtime: docker
    dockerfilePath: ./recommendation-service/Dockerfile
    dockerContext: ./recommendation-service
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    plan: free
    envVars:
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: smartfashion-db
          property: connectionString
